# GoReleaser v2 configuration. Push a tag (git tag v1.0.0 && git push origin v1.0.0)
# and .github/workflows/release.yml publishes binaries for every platform below.
version: 2
project_name: nuclei-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: nuclei-mcp
    main: ./cmd/nuclei-mcp
    binary: nuclei-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: nuclei-mcp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - SECURITY.md
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Security
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: "nuclei-mcp {{ .Tag }}"
  footer: |
    ## Install

    Download the archive for your platform below, or:

    ```bash
    go install github.com/addcontent/nuclei-mcp/cmd/nuclei-mcp@{{ .Tag }}
    ```

    **Full changelog**: https://github.com/addcontent/nuclei-mcp/compare/{{ .PreviousTag }}...{{ .Tag }}
